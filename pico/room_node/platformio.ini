[platformio]
default_envs = kitchen

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200

lib_deps =
    adafruit/DHT sensor library

[env:front_room]
build_flags =
    -D JARVIS_DEVICE_NAME=\"front_room\"

[env:main_room]
build_flags =
    -D JARVIS_DEVICE_NAME=\"main_room\"

[env:kitchen]
build_flags =
    -D JARVIS_DEVICE_NAME=\"kitchen\"

[env:gym]
build_flags =
    -D JARVIS_DEVICE_NAME=\"gym\"

[env:main_bedroom]
build_flags =
    -D JARVIS_DEVICE_NAME=\"main_bedroom\"

[env:arthurs_room]
build_flags =
    -D JARVIS_DEVICE_NAME=\"arthurs_room\"

[env:lilys_room]
build_flags =
    -D JARVIS_DEVICE_NAME=\"lilys_room\"

[env:bar]
build_flags =
    -D JARVIS_DEVICE_NAME=\"bar\"

[env:shed]
build_flags =
    -D JARVIS_DEVICE_NAME=\"shed\"